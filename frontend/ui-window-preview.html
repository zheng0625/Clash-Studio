<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clash Studio 桌面窗口预览</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 'Segoe UI','Microsoft YaHei',sans-serif;background:#e9edf3;color:#263346}button,select{font:inherit}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 22px;background:#fff;border-bottom:1px solid #d9e0ea}h1{font-size:16px;margin:0;font-weight:600}header>div:first-child{margin-right:auto}header p{margin:3px 0 0;font-size:12px;color:#738094}select,button{min-height:36px;padding:6px 10px;border:1px solid #d9e0ea;background:#fff;border-radius:7px;color:inherit}button{cursor:pointer}button[aria-pressed=true]{color:#285dc2;border-color:#95afe1;background:#f2f6ff}a{color:#466caa;text-decoration:none;font-size:12px}label{display:flex;align-items:center;gap:8px;font-size:12px;color:#68798c}.canvas{height:calc(100dvh - var(--toolbar-height,85px));overflow:auto}.canvas-inner{display:grid;place-items:center;width:max-content;min-width:100%;min-height:100%;padding:24px}.screen{position:relative;overflow:hidden;flex-shrink:0;border:1px solid #cad3df;border-radius:11px;background:white;box-shadow:0 14px 45px #263b601a}iframe{display:block;border:0;position:absolute;left:0;top:0;transform-origin:top left;background:#f5f7fa}#scale{font-size:12px;color:#738094;min-width:55px}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #3265d9;outline-offset:3px}@media(max-width:650px){header{padding:12px 14px;gap:10px}header>div:first-child{width:100%}.canvas-inner{padding:16px}label{gap:5px}h1{font-size:15px}}
</style></head><body>
<header id="toolbar"><div><h1>Clash Studio 桌面窗口预览</h1><p>最小窗口 1000 × 680 · 逻辑像素 · 内容在窗口内滚动</p></div><label>窗口尺寸<select id="size"><option value="1000x680">最小窗口 · 1000 × 680</option><option value="1024x768">小屏窗口 · 1024 × 768</option><option value="1280x860">默认窗口 · 1280 × 860</option><option value="1440x900">宽屏窗口 · 1440 × 900</option></select></label><button id="fit" aria-pressed="true">缩放适应</button><span id="scale"></span><a href="/ui-proposal.html?rev=desktop-window" target="_blank" rel="noopener">自由窗口预览 ↗</a></header>
<div class="canvas"><div class="canvas-inner"><div class="screen"><iframe title="Clash Studio 桌面窗口模拟" src="/ui-proposal.html?windowed=1&amp;rev=desktop-window"></iframe></div></div></div>
<script type="module" src="/src/ui-proposal/window-preview.ts"></script></body></html>
